services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
  waha:
    image: devlikeapro/waha
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3000"
    volumes:
      - ./.sessions:/app/.sessions
